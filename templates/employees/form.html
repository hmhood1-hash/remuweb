{% extends "base.html" %}

{% block title %}{% if employee %}Editar Empleado{% else %}Nuevo Empleado{% endif %} - Sistema de Nómina{% endblock %}

{% block content %}
<div class="row mb-4">
    <div class="col-md-12">
        <h2><i class="bi bi-person"></i> {% if employee %}Editar Empleado{% else %}Nuevo Empleado{% endif %}</h2>
    </div>
</div>

<div class="row">
    <div class="col-md-8">
        <div class="card shadow-sm">
            <div class="card-body p-4">
                <form method="POST">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label for="first_name" class="form-label">Nombre</label>
                            <input type="text" class="form-control" id="first_name" name="first_name"
                                   value="{{ employee.first_name if employee else '' }}" required>
                        </div>
                        <div class="col-md-6">
                            <label for="last_name" class="form-label">Apellido</label>
                            <input type="text" class="form-control" id="last_name" name="last_name"
                                   value="{{ employee.last_name if employee else '' }}" required>
                        </div>
                        <div class="col-md-6">
                            <label for="email" class="form-label">Correo Electrónico</label>
                            <input type="email" class="form-control" id="email" name="email"
                                   value="{{ employee.email if employee else '' }}" required>
                        </div>
                        <div class="col-md-6">
                            <label for="phone" class="form-label">Teléfono</label>
                            <input type="text" class="form-control" id="phone" name="phone"
                                   value="{{ employee.phone if employee else '' }}">
                        </div>
                        <div class="col-md-6">
                            <label for="id_number" class="form-label">Cédula / ID</label>
                            <input type="text" class="form-control" id="id_number" name="id_number"
                                   value="{{ employee.id_number if employee else '' }}" required>
                        </div>
                        <div class="col-md-6">
                            <label for="base_salary" class="form-label">Salario Base</label>
                            <div class="input-group">
                                <span class="input-group-text">$</span>
                                <input type="number" step="0.01" min="0" class="form-control" id="base_salary" name="base_salary"
                                       value="{{ employee.base_salary if employee else '' }}" required>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <label for="position" class="form-label">Cargo</label>
                            <input type="text" class="form-control" id="position" name="position"
                                   value="{{ employee.position if employee else '' }}">
                        </div>
                        <div class="col-md-6">
                            <label for="department" class="form-label">Departamento</label>
                            <input type="text" class="form-control" id="department" name="department"
                                   value="{{ employee.department if employee else '' }}">
                        </div>
                        {% if employee %}
                        <div class="col-md-12">
                            <div class="form-check">
                                <input type="checkbox" class="form-check-input" id="is_active" name="is_active"
                                       {% if employee.is_active %}checked{% endif %}>
                                <label class="form-check-label" for="is_active">Empleado Activo</label>
                            </div>
                        </div>
                        {% endif %}
                    </div>

                    <div class="d-flex gap-2 mt-4">
                        <button type="submit" class="btn btn-primary">
                            <i class="bi bi-save"></i> Guardar
                        </button>
                        <a href="{{ url_for('employees.list_employees') }}" class="btn btn-secondary">Cancelar</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
