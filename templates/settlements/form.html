{% extends "base.html" %}

{% block title %}Nuevo Finiquito - Sistema de Remuneraciones{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-8">
        <div class="card border-0 shadow-sm">
            <div class="card-header bg-white"><h2 class="h4 mb-0">Calcular finiquito</h2></div>
            <div class="card-body">
                <form method="POST" class="row g-3">
                    <input type="hidden" name="csrf_token" value="">
                    <div class="col-12">
                        <label for="employee_id" class="form-label">Empleado</label>
                        <select class="form-select" id="employee_id" name="employee_id" required>
                            <option value="">Selecciona un empleado</option>
                            {% for employee in employees %}
                            <option value="{{ employee.id }}">{{ employee.full_name }} · {{ employee.position }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="col-md-6">
                        <label for="termination_date" class="form-label">Fecha de término</label>
                        <input type="date" class="form-control" id="termination_date" name="termination_date" required>
                    </div>
                    <div class="col-md-6">
                        <label for="termination_reason" class="form-label">Causal</label>
                        <select class="form-select" id="termination_reason" name="termination_reason" required>
                            <option value="">Selecciona una causal</option>
                            <option value="renuncia">Renuncia</option>
                            <option value="despido_justificado">Despido justificado</option>
                            <option value="despido_injustificado">Despido injustificado</option>
                            <option value="mutuo_acuerdo">Mutuo acuerdo</option>
                        </select>
                    </div>
                    <div class="col-12">
                        <label for="notes" class="form-label">Notas</label>
                        <textarea class="form-control" id="notes" name="notes" rows="4" placeholder="Observaciones del cálculo o acuerdos adicionales"></textarea>
                    </div>
                    <div class="col-12 d-flex justify-content-end gap-2">
                        <a href="{{ url_for('settlements.list_settlements') }}" class="btn btn-secondary">Cancelar</a>
                        <button type="submit" class="btn btn-primary">Calcular finiquito</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
